[project]
name = "pytest-imports"
version = "0.1.4"
description = "A pythonic derivative of ArchUnit, in the form of a pytest plugin."
license = { text = "Apache-2.0" }
authors = [{ name = "Niko Wilbert", email = "mail@nikowilbert.de" }]
classifiers = ["Framework :: Pytest"]
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.2.2",
]

[project.entry-points."pytest11"]
imports = "pytest_imports.plugin"

[dependency-groups]
nox = ["nox>=2026.2.9"]
lint = ["ruff>=0.15.8"]
# nox is a typecheck dependency because noxfile.py is on the mypy path.
typecheck = ["mypy>=1.20.0", {include-group = "nox"}]
test = ["pytest-mock>=3.15.1"]
coverage = [{include-group = "test"}, "coverage>=7.13.5"]
audit = ["pip-audit>=2.10.0"]
dev = [
    {include-group = "nox"},
    "pytest>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_imports"]

[tool.uv]
exclude-newer = "7d"
# To pull a security fix in before the cooldown expires, add an
# `exclude-newer-package` override — as an explicit UTC instant
# ("2026-06-20T00:00:00Z"), never a bare date. uv reads a bare date as the end
# of that day in the *local* timezone and stores the resolved instant in
# uv.lock, so a lockfile written outside UTC fails CI's `--locked` sync. Drop
# the override once the window has moved past it.

[tool.pytest.ini_options]
testpaths = ["test/unit", "test/integration", "test/arch"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "SIM", "UP", "W", "PYI"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = false
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
disallow_untyped_defs = true
